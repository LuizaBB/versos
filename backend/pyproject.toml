[project]
name = "versos-api"
version = "0.1.0"
requires-python = ">=3.12"
# Vercel resolves deps with `uv` from this file; without `dependencies`, `requirements.txt` is ignored.
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "alembic==1.14.0",
  "pydantic[email]==2.10.3",
  "pydantic-settings==2.6.1",
  "python-jose[cryptography]==3.3.0",
  "bcrypt==4.2.1",
  "python-multipart==0.0.17",
]

[tool.vercel]
entrypoint = "app.main:app"
